[build]
  publish = "website/site"
  # Production builds hide unreleased content until its reveal/release date.
  # Deploy previews and branch deploys use coursemd's build-preview command so
  # reviewers can see not-yet-released recitations/assignments before they go live.
  command = "pip install -e './vendor/course.md[all]' -r requirements.txt && cd website && if [ \"$CONTEXT\" = \"production\" ]; then mkdocs build; else coursemd site build-preview --output-dir site; fi"

[build.environment]
  PYTHON_VERSION = "3.11"
